<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tecnosaude — dashboard para gestão de clientes, treinos, dietas e evolução."
    />
    <title>Tecnosaude | Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-box">
          <div class="logo">T</div>
          <div>
            <strong>Tecnosaude</strong>
            <small>Performance &amp; saúde</small>
          </div>
        </div>

        <nav class="side-nav" aria-label="Menu principal">
          <button class="nav-item active" type="button">Dashboard</button>
          <button class="nav-item" type="button">Clientes</button>
          <button class="nav-item" type="button">Treinos</button>
          <button class="nav-item" type="button">Dietas</button>
          <button class="nav-item" type="button">Evolução</button>
          <button class="nav-item" type="button">Agenda</button>
          <button class="nav-item" type="button">Mensagens</button>
          <button class="nav-item" type="button">Configurações</button>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Dashboard</p>
            <h1>Visão geral</h1>
          </div>
          <button id="openClientForm" class="primary-btn" type="button">
            Novo cliente
          </button>
        </header>

        <section class="stats-grid" aria-label="Estatísticas principais">
          <article class="stat-card accent">
            <span class="label">Clientes</span>
            <strong id="totalClients">0</strong>
            <small>Ativos no mês</small>
          </article>
          <article class="stat-card">
            <span class="label">Treinos</span>
            <strong>24</strong>
            <small>Programados</small>
          </article>
          <article class="stat-card">
            <span class="label">Dietas</span>
            <strong>18</strong>
            <small>Planejadas</small>
          </article>
          <article class="stat-card">
            <span class="label">Cobrança</span>
            <strong>R$ 9.8k</strong>
            <small>Em atraso: 3</small>
          </article>
        </section>

        <section class="overview-grid">
          <article class="panel chart-panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Evolução</p>
                <h2>Progresso mensal</h2>
              </div>
            </div>
            <div id="chartBars" class="chart-bars" aria-label="Gráfico de evolução"></div>
          </article>

          <article class="panel agenda-panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Agenda</p>
                <h2>Próximos atendimentos</h2>
              </div>
            </div>
            <ul id="agendaList" class="agenda-list"></ul>
          </article>
        </section>

        <section class="panel clients-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Clientes</p>
              <h2>Lista de acompanhamento</h2>
            </div>
            <label class="search-box" aria-label="Buscar cliente">
              <span>Buscar</span>
              <input id="searchInput" type="search" placeholder="Nome, objetivo ou plano" />
            </label>
          </div>

          <div id="clientsList" class="clients-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <div id="clientModal" class="modal" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-head">
          <h3 id="modalTitle">Adicionar cliente</h3>
          <button id="closeClientModal" class="close-btn" type="button" aria-label="Fechar modal">
            ×
          </button>
        </div>

        <form id="clientForm">
          <div class="field-row">
            <label>
              Nome
              <input name="nome" type="text" required placeholder="Ex: Maria Silva" />
            </label>
            <label>
              Objetivo
              <input name="objetivo" type="text" required placeholder="Ex: Emagrecimento" />
            </label>
          </div>

          <div class="field-row">
            <label>
              Plano
              <select name="plano" required>
                <option value="">Selecione</option>
                <option value="Emagrecimento">Emagrecimento</option>
                <option value="Hipertrofia">Hipertrofia</option>
                <option value="Performance">Performance</option>
                <option value="Reabilitação">Reabilitação</option>
              </select>
            </label>
            <label>
              Status
              <select name="status" required>
                <option value="Ativo">Ativo</option>
                <option value="Em progresso">Em progresso</option>
                <option value="Aguardando">Aguardando</option>
              </select>
            </label>
          </div>

          <div class="field-row single">
            <label>
              Observações
              <textarea name="observacoes" rows="3" placeholder="Detalhes do acompanhamento"></textarea>
            </label>
          </div>

          <div class="form-actions">
            <button type="button" class="secondary-btn" id="cancelClientModal">Cancelar</button>
            <button type="submit" class="primary-btn">Salvar cliente</button>
          </div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
