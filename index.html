<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tecnosaude — gestão inteligente de treinos, nutrição e evolução." />
    <title>Tecnosaude | Performance e saúde</title>
    <style>
      :root {
        --navy: #102b45;
        --green: #16a58a;
        --bg: #f5faf9;
        --card: #ffffff;
        --text: #16314d;
        --muted: #5d7285;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #edf5f8 35%, #f9fbfc 100%);
        color: var(--text);
      }

      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      .card {
        width: min(900px, 100%);
        background: var(--card);
        border-radius: 28px;
        box-shadow: 0 24px 60px rgba(16, 43, 69, 0.12);
        padding: 48px 42px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        font-weight: 700;
        font-size: 1.15rem;
        color: var(--navy);
        text-decoration: none;
      }

      .logo {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--green), #69ddb0);
        color: white;
        font-weight: 800;
      }

      .brand small {
        display: block;
        font-size: 0.72rem;
        color: var(--muted);
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 32px 0 14px;
        font-size: clamp(2.5rem, 6vw, 4.6rem);
        line-height: 1.02;
        letter-spacing: -0.06em;
        color: var(--navy);
      }

      h1 span {
        color: var(--green);
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .cta {
        margin-top: 30px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: var(--navy);
        color: white;
        padding: 14px 22px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
      }

      .cta::after {
        content: "→";
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <a href="#" class="brand" aria-label="Tecnosaude">
          <span class="logo">T</span>
          <span>
            <strong>Tecnosaude</strong>
            <small>performance &amp; saúde</small>
          </span>
        </a>

        <h1>Seu objetivo, <span>em movimento</span>.</h1>
        <p>
          A Tecnosaude centraliza treino, nutrição e evolução em uma experiência moderna,
          clara e orientada a resultados.
        </p>

        <a href="#" class="cta">Conheça a plataforma</a>
      </div>
    </div>
  </body>
</html>
